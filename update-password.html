<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ตั้งรหัสผ่านใหม่ | Advance Network CCTV</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#10243d;font-family:Prompt,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);background:#fff;border:1px solid #e1e8f0;border-radius:18px;padding:28px;box-shadow:0 14px 40px #10243d12}h1{font:600 25px Kanit;margin:0 0 8px}.muted{color:#6b7d91;font-size:13px;line-height:1.7}.field{margin:16px 0}.field label{display:block;font-size:13px;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #d5dfeb;border-radius:9px;font:14px Prompt}.btn{border:0;border-radius:9px;background:#ff7900;color:#fff;padding:12px 18px;font:600 14px Prompt;cursor:pointer;width:100%}.msg{padding:12px;border-radius:9px;background:#fff3e6;color:#8a4b08;font-size:13px;margin:14px 0;line-height:1.6}.success{background:#eaf8ef;color:#176b3b}.hidden{display:none}a{color:#145c9e}
</style>
</head>
<body>
<main class="card">
<h1>ตั้งรหัสผ่าน Admin ใหม่</h1>
<p class="muted">Advance Network CCTV — กรุณากำหนดรหัสผ่านใหม่สำหรับบัญชีผู้ดูแลระบบ</p>
<div id="status" class="msg">กำลังตรวจสอบลิงก์รีเซ็ตรหัสผ่าน…</div>
<form id="resetForm" class="hidden">
<div class="field"><label for="newPassword">รหัสผ่านใหม่</label><input id="newPassword" type="password" minlength="12" autocomplete="new-password" required placeholder="อย่างน้อย 12 ตัวอักษร"></div>
<div class="field"><label for="confirmPassword">ยืนยันรหัสผ่านใหม่</label><input id="confirmPassword" type="password" minlength="12" autocomplete="new-password" required placeholder="กรอกรหัสผ่านอีกครั้ง"></div>
<button class="btn" id="saveBtn" type="submit">บันทึกรหัสผ่านใหม่</button>
</form>
<p class="muted" style="margin-top:18px"><a href="admin-warranty.html">กลับไปหน้าเข้าสู่ระบบ Admin</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://uqwubpdolhrxtavkuzvg.supabase.co';
const SUPABASE_KEY='sb_publishable_VcGIlWbzb2Y6EQC2SvQAFA_y2cICvPO';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const statusBox=document.getElementById('status');
const form=document.getElementById('resetForm');
function showError(message){statusBox.textContent=message;statusBox.classList.remove('success');form.classList.add('hidden')}
(async()=>{
  const params=new URLSearchParams(location.hash.slice(1));
  const errorCode=params.get('error_code'),errorDescription=params.get('error_description');
  if(errorCode){showError('ลิงก์ไม่สามารถใช้ได้: '+(errorDescription||errorCode)+' กรุณากลับไปหน้า Admin แล้วขอลิงก์ใหม่');return;}
  const {data,error}=await supabase.auth.getSession();
  if(error||!data.session){showError('ไม่พบเซสชันสำหรับตั้งรหัสผ่าน ลิงก์อาจหมดอายุหรือไม่ถูกต้อง กรุณากลับไปหน้า Admin แล้วส่งลิงก์ใหม่');return;}
  statusBox.textContent='ตรวจสอบลิงก์เรียบร้อยแล้ว กรุณากำหนดรหัสผ่านใหม่';
  statusBox.classList.add('success');form.classList.remove('hidden');
})();
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const password=document.getElementById('newPassword').value;
  const confirm=document.getElementById('confirmPassword').value;
  if(password.length<12){showError('รหัสผ่านต้องมีอย่างน้อย 12 ตัวอักษร');return;}
  if(password!==confirm){showError('รหัสผ่านทั้งสองช่องไม่ตรงกัน');form.classList.remove('hidden');return;}
  const btn=document.getElementById('saveBtn');btn.disabled=true;btn.textContent='กำลังบันทึก…';
  const {error}=await supabase.auth.updateUser({password});
  if(error){showError('เปลี่ยนรหัสผ่านไม่สำเร็จ: '+error.message);form.classList.remove('hidden');btn.disabled=false;btn.textContent='บันทึกรหัสผ่านใหม่';return;}
  await supabase.auth.signOut();
  form.classList.add('hidden');statusBox.textContent='เปลี่ยนรหัสผ่านสำเร็จแล้ว กรุณากลับไปหน้า Admin และเข้าสู่ระบบด้วยรหัสผ่านใหม่';
  statusBox.classList.add('success');
});
</script>
</body></html>
