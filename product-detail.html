<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06172e"><title>รายละเอียดสินค้า | Advance Network</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#071a31;--blue:#12385e;--orange:#ed6b0a;--ink:#172b43;--muted:#6c7e92;--line:#e2e8ef;--bg:#f5f6f8}*{box-sizing:border-box}body{margin:0;font-family:Prompt,sans-serif;color:var(--ink);background:#fff;line-height:1.65}a{text-decoration:none;color:inherit}button{font:inherit;cursor:pointer}.container{width:min(1320px,calc(100% - 34px));margin:auto}header{background:#f7f9fc;border-bottom:1px solid var(--line)}.nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:15px}.logo{font:700 21px Kanit;color:var(--navy)}.navlinks{display:flex;align-items:center;gap:20px;font-size:12px;color:#254461}.cart{background:var(--navy);color:white;padding:10px 15px;border-radius:10px}.crumb{padding:24px 0;color:#718196;font-size:12px}.crumb a{color:#173c61}.product-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,1fr);gap:32px;padding:18px 0 55px;align-items:start}.gallery{border:1px solid #e3e3e3;background:#fff;min-height:470px;display:grid;place-items:center;padding:25px}.gallery img{width:100%;height:440px;object-fit:contain}.gallery .placeholder{color:#91a0af}.brand{color:#d34b18;font-size:13px}.info h1{font:600 29px/1.3 Kanit;margin:3px 0 15px}.rule{height:1px;background:#e3e6e9;margin:14px 0}.model{font-size:13px;color:#5d6d7d}.price{font:700 28px Kanit;color:#333;margin:28px 0 0}.tax{font-size:11px;color:#777}.condition{display:inline-block;background:#e7f4e4;color:#367a37;padding:7px 12px;border-radius:5px;font-size:12px;margin-top:16px}.stock{font-size:12px;color:#6b7b8d;margin-top:12px}.stock.sold-out{font:600 29px/1.3 Kanit,sans-serif;color:#d62828;margin-top:12px}.actions{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}.qty{width:75px;padding:11px;border:1px solid var(--line);border-radius:7px}.btn{border:0;border-radius:7px;padding:12px 22px;font-weight:600;font-size:13px}.add{background:#bd260e;color:#fff}.line{background:#08a94c;color:#fff}.disabled{background:#e9edf1;color:#8793a0}.specs{border:1px solid #e2e2e2;padding:22px;margin:0 0 55px}.specs h2{font:600 20px Kanit;margin:0 0 12px}.spec-table{display:grid;grid-template-columns:1fr 1fr;gap:8px}.spec-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#f2f2f2;padding:12px;font-size:12px}.spec-row .key{color:#647386}.description{white-space:pre-line;font-size:13px;color:#53677e;margin-top:22px}.spec-empty{color:#7d8b99;font-size:12px;padding:15px;background:#f7f8fa;border-radius:8px}.loading{text-align:center;padding:80px;color:#718196}.error{color:#b42318}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#102b49;color:white;padding:12px 18px;border-radius:9px;display:none;font-size:12px;z-index:5}.toast.show{display:block}
@media(max-width:760px){.nav{height:64px}.logo{font-size:17px}.navlinks{gap:10px}.product-layout{grid-template-columns:1fr;gap:20px;padding-top:5px}.gallery{min-height:300px}.gallery img{height:300px}.info h1{font-size:24px}.spec-table{grid-template-columns:1fr}.spec-row{grid-template-columns:1fr 1.2fr}.specs{padding:14px}.crumb{padding:15px 0}}
</style></head><body>
<header><div class="container nav"><a class="logo" href="secondhand.html">ADVANCE NETWORK</a><div class="navlinks"><a href="secondhand.html">กลับหน้าร้าน</a><a href="index.html">เว็บไซต์หลัก</a><button class="cart" id="cartButton">🛒 ตะกร้า <span id="cartCount">0</span></button></div></div></header>
<main class="container"><div class="crumb"><a href="secondhand.html">หน้าร้าน</a> / รายละเอียดสินค้า / <span id="crumbName">กำลังโหลด...</span></div>
<div id="content" class="loading">กำลังโหลดข้อมูลสินค้า...</div></main><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{'use strict';
const client=window.supabase.createClient('https://uqwubpdolhrxtavkuzvg.supabase.co','sb_publishable_VcGIlWbzb2Y6EQC2SvQAFA_y2cICvPO');
const $=id=>document.getElementById(id),money=n=>'฿'+Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CART_KEY='advance_network_secondhand_cart_v1',params=new URLSearchParams(location.search),id=params.get('id');
function photo(path){if(!path)return '';return /^https?:/i.test(path)?path:client.storage.from('used-products').getPublicUrl(path).data.publicUrl}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function count(){try{const c=JSON.parse(localStorage.getItem(CART_KEY)||'[]');$('cartCount').textContent=c.reduce((n,x)=>n+Number(x.quantity||0),0)}catch{$('cartCount').textContent='0'}}
$('cartButton').onclick=()=>location.href='secondhand.html#cart';
async function load(){if(!id){$('content').innerHTML='<p class="error">ไม่พบรหัสสินค้า</p>';return}
const {data:p,error}=await client.from('used_products').select('id,sku,name,category,brand,model,description,condition_label,warranty_label,price,stock_qty,cover_image,specifications,is_published').eq('id',id).eq('is_published',true).maybeSingle();
if(error||!p){$('content').innerHTML='<p class="error">ไม่พบสินค้านี้ หรือสินค้าถูกปิดการขายแล้ว</p>';return}
document.title=p.name+' | Advance Network';$('crumbName').textContent=p.name;
const img=photo(p.cover_image),specs=Array.isArray(p.specifications)?p.specifications:[];
$('content').className='';$('content').innerHTML='<section class="product-layout"><div class="gallery">'+(img?'<img src="'+esc(img)+'" alt="'+esc(p.name)+'">':'<span class="placeholder">ไม่มีรูปภาพสินค้า</span>')+'</div><div class="info"><div class="brand">'+esc([p.brand,p.model].filter(Boolean).join(' · ')||p.category)+'</div><h1>'+esc(p.name)+'</h1><div class="rule"></div><div class="model">'+(p.sku?'รหัสสินค้า: '+esc(p.sku)+' · ':'')+'สภาพสินค้า: '+esc(p.condition_label||'มือสอง')+'</div><div class="price">'+money(p.price)+'</div><div class="tax">ราคาสินค้า</div><div class="stock '+(Number(p.stock_qty)>0?'':'sold-out')+'">'+(Number(p.stock_qty)>0?'มีสินค้าพร้อมจำหน่าย '+Number(p.stock_qty)+' ชิ้น':'สินค้าหมด')+'</div><div class="condition">✓ '+esc(p.warranty_label||'ตรวจสอบสภาพก่อนจัดส่ง')+'</div><div class="actions"><input class="qty" id="qty" type="number" min="1" max="'+Math.max(1,Number(p.stock_qty))+'" value="1" '+(Number(p.stock_qty)<1?'disabled':'')+'><button class="btn add '+(Number(p.stock_qty)<1?'disabled':'')+'" id="add" '+(Number(p.stock_qty)<1?'disabled':'')+'>เพิ่มลงตะกร้า</button><a class="btn line" href="https://lin.ee/Xa6OI5f" target="_blank" rel="noopener">สอบถามผ่าน LINE</a></div><div class="description">'+esc(p.description||'สอบถามรายละเอียดเพิ่มเติมได้ทาง LINE')+'</div></div></section><section class="specs"><h2>ข้อมูลสินค้า</h2>'+(specs.length?'<div class="spec-table">'+specs.map(s=>'<div class="spec-row"><span class="key">'+esc(s.label)+'</span><span>'+esc(s.value)+'</span></div>').join('')+'</div>':'<div class="spec-empty">ยังไม่มีข้อมูลคุณสมบัติเพิ่มเติม หากต้องการให้แสดงตารางแบบตัวอย่าง สามารถเพิ่มหัวข้อและรายละเอียดได้จากหน้า Admin</div>')+'</section>';
$('add')?.addEventListener('click',()=>{const qty=Math.max(1,Math.min(Number(p.stock_qty),Number($('qty').value)||1));let cart=[];try{cart=JSON.parse(localStorage.getItem(CART_KEY)||'[]')}catch{}const item=cart.find(x=>x.id===p.id);if(item)item.quantity=Math.min(Number(p.stock_qty),item.quantity+qty);else cart.push({id:p.id,quantity:qty});localStorage.setItem(CART_KEY,JSON.stringify(cart));count();toast('เพิ่มสินค้าในตะกร้าแล้ว')});
}
count();load();
})();
</script></body></html>
