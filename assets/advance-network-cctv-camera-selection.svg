  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#18c8ee"/><stop offset="1" stop-color="#4a9dff"/></linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
